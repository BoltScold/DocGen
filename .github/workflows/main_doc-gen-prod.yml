# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - doc-gen-prod

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.' # set this to the path to your web app project, defaults to the repository root
  PYTHON_VERSION: '3.13' # set this to the python version to use (supports 3.6, 3.7, 3.8)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python version
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies for Azure Functions
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --target=".python_packages/lib/site-packages" \
            -r requirements.txt

      - name: Create virtual environment and validate dependencies
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip check
          python -m compileall -q app.py   

      - name: Verify required dependencies
        run: |
          PYTHONPATH=".python_packages/lib/site-packages" python - <<'PY'
          import os
          import certifi
          import lxml
          import pypdf

          ca_bundle = certifi.where()

          print("lxml:", lxml.__version__)
          print("pypdf:", pypdf.__version__)
          print("CA bundle:", ca_bundle)
          print("CA bundle exists:", os.path.isfile(ca_bundle))

          if not os.path.isfile(ca_bundle):
              raise RuntimeError(
                  f"certifi CA bundle is missing: {ca_bundle}"
              )
          PY

      - name: Zip artifact for deployment
        run: |
          zip -r release.zip . \
            -x "venv/*" \
            -x ".venv/*" \
            -x ".git/*" \
            -x ".github/*" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x ".env" \

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            release.zip
            !venv/

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact for deployment
        run: |
          unzip release.zip
          rm release.zip
        
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_517E91F5331A4CB180BD4A504340359D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2D32CEEC0CC44A1F8FEC132538F7FF49 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_5C5A29E1A0954F1D901B20309A3B33E9 }}

      - name: Configure Function App settings
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az functionapp config appsettings set \
              --resource-group "rg-docgen-prod" \
              --name "doc-gen-prod" \
              --settings \
                "SITE_URL=${{ vars.SP_SITE_URL }}" \
                "TENANT_ID=${{ secrets.SP_TENANT_ID }}" \
                "CLIENT_ID=${{ secrets.SP_CLIENT_ID }}" \
                "THUMBPRINT=${{ secrets.SP_THUMBPRINT }}" \
                "CERT_BASE64=${{ secrets.SP_CERT_BASE64 }}"    

      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'doc-gen-prod'
          slot-name: 'Production'
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          